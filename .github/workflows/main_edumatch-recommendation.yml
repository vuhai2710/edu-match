name: Build and deploy FastAPI app to Azure Web App - edumatch-recommendation

on:
  push:
    branches:
      - main
    paths:
      - "backend/recommendation_service/**"
      - ".github/workflows/main_edumatch-recommendation.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend/recommendation_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "edumatch-recommendation"
          publish-profile: ${{ secrets.AZURE_RECOMMENDATION_WEBAPP_PUBLISH_PROFILE }}
          package: backend/recommendation_service