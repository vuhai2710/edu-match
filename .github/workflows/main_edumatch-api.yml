name: Build and deploy ASP.NET Core app to Azure Web App - edumatch-api

on:
  push:
    branches:
      - main
    paths:
      - "backend/EduMatch/**"
      - ".github/workflows/main_edumatch-api.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore backend/EduMatch/EduMatch.csproj

      - name: Build
        run: dotnet build backend/EduMatch/EduMatch.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish backend/EduMatch/EduMatch.csproj -c Release -o publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "edumatch-api"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
